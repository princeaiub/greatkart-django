<!-- For logout auto after 10 min if user is in active -->
<script>
(function() {
    const logoutAfter = 10 * 60 * 1000;  // 10 minutes
    const warningTime = 9 * 60 * 1000;   // Show warning after 9 minutes
    let warningTimer, logoutTimer;

    function startTimers() {
        clearTimeout(warningTimer);
        clearTimeout(logoutTimer);

        // Show warning at 9 minutes
        warningTimer = setTimeout(showWarning, warningTime);

        // Logout at 10 minutes
        logoutTimer = setTimeout(logout, logoutAfter);
    }

    function resetTimers() {
        startTimers(); // Reset both timers on activity
    }

    function showWarning() {
        if (confirm("⚠️ You will be logged out in 1 minute due to inactivity. Click OK to stay logged in.")) {
            resetTimers(); // User clicked OK → reset timers
        }
    }

    function logout() {
        window.location.href = "{% url 'sign_out' %}";
    }

    // Detect user activity
    window.onload = resetTimers;
    document.onmousemove = resetTimers;
    document.onkeypress = resetTimers;
    document.onclick = resetTimers;
    document.onscroll = resetTimers;
})();
</script>
