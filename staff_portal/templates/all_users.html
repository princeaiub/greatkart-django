{% extends 'base_main.html'%}
{%load static%} 
{%block content%}
<div class="container-fluid d-flex justify-content-center align-items-center bg-light">
    <div class="card form-card shadow-lg p-4 card_main_all_user">
        <h3 class="mb-3 text-center">All Users</h3>
        <p class="text-muted text-center mb-4 secondary_text">List of all staff users</p>
        <div class="search_add_user">
            <div class="row">
                <div class="col">
                    <div class="input-group search-bar flex-grow-1">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="all_user_search" class="form-control border-start-0" placeholder="Search By first name, username or phone.." />
                    </div>
                </div>
                <div class="col ">
                    <a href="{% url 'add_user' %}" class="btn btn-outline-primary btn-lg float-end btn_adduser">
            + Add New User
            </a>
                </div>
            </div>
        </div>
        <hr/>
        <div>
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">User</th>
                        <th scope="col">Username</th>
                        <th scope="col">Email</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody id="user_table_data">
                    <!-- Data will come from include/user_table_vody.html -->
                    {%include 'includes/user_table_body.html'%}
                </tbody>
            </table>
            <!-- Pagination links -->
            <div id="user_table_pagination">
                {% include 'includes/user_table_pagination.html'%}
            </div>
            <!-- Pagination links End-->
        </div>
    </div>
</div>
<script>
    const all_user_search ="{% url 'all_user_search'%}";
</script>
<script src="{% static 'js/all_user_search.js'%}"></script>
{% endblock %}
